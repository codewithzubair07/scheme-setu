<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scheme Application Mock Form</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; }
        .container { max-width: 760px; margin: 24px auto; background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 3px 10px rgba(0,0,0,0.12); }
        h1 { margin-top: 0; color: #173b72; }
        .row { display: flex; gap: 16px; margin-bottom: 14px; }
        .field { flex: 1; }
        label { display: block; margin-bottom: 6px; font-weight: 600; }
        input { width: 100%; padding: 10px; border: 1px solid #c9d1db; border-radius: 6px; box-sizing: border-box; }
        .docs { margin-top: 20px; border: 1px solid #dfe4ea; padding: 14px; border-radius: 8px; }
        .docs h3 { margin-top: 0; }
        .doc-item { margin: 8px 0; }
        .footer-note { margin-top: 16px; color: #666; font-size: 12px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Government Scheme Application (Mock)</h1>

    <div class="row">
        <div class="field">
            <label for="full_name">Full Name</label>
            <input id="full_name" name="full_name" type="text" />
        </div>
        <div class="field">
            <label for="aadhaar_number">Aadhaar Number</label>
            <input id="aadhaar_number" name="aadhaar_number" type="text" />
        </div>
    </div>

    <div class="row">
        <div class="field">
            <label for="category">Category</label>
            <input id="category" name="category" type="text" />
        </div>
        <div class="field">
            <label for="annual_income">Annual Income (INR)</label>
            <input id="annual_income" name="annual_income" type="text" />
        </div>
    </div>

    <div class="row">
        <div class="field">
            <label for="state">State</label>
            <input id="state" name="state" type="text" />
        </div>
        <div class="field">
            <label for="scheme_name">Scheme Name</label>
            <input id="scheme_name" name="scheme_name" type="text" />
        </div>
    </div>

    <div class="docs">
        <h3>Documents Required</h3>
        <div id="documents_container"></div>
    </div>

    <div class="footer-note">This is a mock visual form for demonstration only.</div>
</div>
</body>
</html>
