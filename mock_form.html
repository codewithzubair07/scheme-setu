<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scheme Application Mock Form</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; }
        .container { max-width: 760px; margin: 24px auto; background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 3px 10px rgba(0,0,0,0.12); }
        h1 { margin-top: 0; color: #173b72; }
        .row { display: flex; gap: 16px; margin-bottom: 14px; }
        .field { flex: 1; }
        label { display: block; margin-bottom: 6px; font-weight: 600; }
        .value { width: 100%; padding: 10px; border: 1px solid #c9d1db; border-radius: 6px; box-sizing: border-box; background: #fbfcfd; }
        .docs { margin-top: 20px; border: 1px solid #dfe4ea; padding: 14px; border-radius: 8px; }
        .docs h3 { margin-top: 0; }
        .docs ul { margin: 0; padding-left: 18px; }
        .footer-note { margin-top: 16px; color: #666; font-size: 12px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Government Scheme Application (Mock)</h1>

    <div class="row">
        <div class="field">
            <label>Full Name</label>
            <div class="value">{{full_name}}</div>
        </div>
        <div class="field">
            <label>Aadhaar Number</label>
            <div class="value">{{aadhaar_number}}</div>
        </div>
    </div>

    <div class="row">
        <div class="field">
            <label>Category</label>
            <div class="value">{{category}}</div>
        </div>
        <div class="field">
            <label>Annual Income (INR)</label>
            <div class="value">{{annual_income}}</div>
        </div>
    </div>

    <div class="row">
        <div class="field">
            <label>State</label>
            <div class="value">{{state}}</div>
        </div>
        <div class="field">
            <label>Target</label>
            <div class="value">{{scheme_name}}</div>
        </div>
    </div>

    <div class="docs">
        <h3>Documents Required</h3>
        <ul>
            {{documents_html}}
        </ul>
    </div>

    <div class="docs">
        <h3>How to Apply (Mock Guidance)</h3>
        <div>{{how_to_apply}}</div>
    </div>

    <div class="footer-note">This is a mock visual form for demonstration only.</div>
</div>
</body>
</html>
